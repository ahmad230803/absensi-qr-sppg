<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Absensi Relawan SPPG</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  padding: 20px;
  margin: 0;
}
.container {
  max-width: 480px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 18px;
}
h2 {
  text-align: center;
  color: #166534;
}
p {
  text-align: center;
  color: #64748b;
}
#reader {
  width: 100%;
  margin-top: 20px;
}
#hasil {
  padding: 15px;
  margin-top: 20px;
  border-radius: 12px;
  text-align: center;
  font-weight: bold;
  background: #e2e8f0;
}
</style>
</head>

<body>

<div class="container">
  <h2>ABSENSI RELAWAN</h2>
  <p>SPPG SUNGAI LINTANG</p>
  <p>Arahkan QR Code relawan ke kamera</p>

  <div id="reader"></div>
  <div id="hasil">Menyiapkan kamera...</div>
</div>

<iframe name="kirim" id="kirim" style="display:none"></iframe>

<form id="formKirim"
      method="GET"
      target="kirim"
      action="https://script.google.com/macros/s/AKfycbxrlJkbsZ6D0_03jFGnGZVwynWD9ExEXYaeQUlkRLGPYi_mjJE077JyrSTxBJs-AKKasQ/exec">
  <input type="hidden" name="qr" id="qr">
</form>

<script>
const hasil = document.getElementById("hasil");
const scanner = new Html5Qrcode("reader");

let proses = false;

function scanBerhasil(kode) {
  if (proses) return;

  proses = true;
  scanner.pause(true);

  document.getElementById("qr").value = kode;
  document.getElementById("formKirim").submit();

  hasil.style.background = "#dcfce7";
  hasil.innerText = "QR terbaca! Data sedang dikirim...";

  setTimeout(() => {
    proses = false;
    hasil.style.background = "#e2e8f0";
    hasil.innerText = "Siap scan relawan berikutnya";
    scanner.resume();
  }, 4000);
}

Html5Qrcode.getCameras().then(kameras => {
  if (!kameras.length) {
    hasil.innerText = "Kamera tidak ditemukan";
    return;
  }

  const kamera = kameras[kameras.length - 1];

  scanner.start(
    kamera.id,
    { fps: 10, qrbox: { width: 250, height: 250 } },
    scanBerhasil
  ).catch(error => {
    hasil.innerText = "Kamera gagal dibuka: " + error;
  });

}).catch(error => {
  hasil.innerText = "Kamera gagal diakses: " + error;
});
</script>

</body>
</html>
